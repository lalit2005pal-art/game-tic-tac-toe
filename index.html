<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>

    <h2 id="status">Player X's Turn</h2>

    <div class="board">
        <div class="cell" onclick="play(this, 0)"></div>
        <div class="cell" onclick="play(this, 1)"></div>
        <div class="cell" onclick="play(this, 2)"></div>
        <div class="cell" onclick="play(this, 3)"></div>
        <div class="cell" onclick="play(this, 4)"></div>
        <div class="cell" onclick="play(this, 5)"></div>
        <div class="cell" onclick="play(this, 6)"></div>
        <div class="cell" onclick="play(this, 7)"></div>
        <div class="cell" onclick="play(this, 8)"></div>
    </div>

    <button onclick="resetGame()">Restart Game</button>

    <script>
        let currentPlayer = "X";
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        const winPatterns=[
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function play(cell, index){
            if(board[index] !== "" || !gameActive) {
                return;
            }

            board[index] = currentPlayer;
            cell.innerHTML = currentPlayer;

            if (checkWinner()){
                document.getElementById("status").innerHTML= "Player" + currentPlayer + "Wins!";
                gameActive = false;
                return;
            }

            if (!board.includes("")){
                document.getElementById("status").innerHTML= "It's a Draw!";
                gameActive = false;
                return;
            }
            currentPlayer = (currentPlayer === "X")? "O" : "X";
            document.getElementById("status").innerHTML= "Player" + currentPlayer + "'s Turn";
        }

        function checkWinner(){
            for(let i=0; i< winPatterns.length; i++){
                let [a, b, c] = winPatterns[i];

                if (board[a] !== "" && board[a] === board[b] && board[a] === board[c]){
                    return true;
                }
            }
            return false;
        }

        function resetGame(){
            window.location.reload();
        }
    </script>
</body>
</html>
